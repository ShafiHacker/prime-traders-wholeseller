<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Catalog Management | Prime Traders Wholeseller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Admin Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-slate-950 font-black text-xl w-10 h-10 flex items-center justify-center rounded-xl shadow-lg">P</div>
                <div>
                    <h1 class="text-base font-black tracking-wider uppercase text-white">ADMIN CATALOG PANEL</h1>
                    <p class="text-[10px] text-amber-400 font-bold uppercase tracking-widest">Prime Traders Wholeseller</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-globe"></i> View Public Catalog
                </a>
                <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- Add Product Form Box -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
            <div class="border-b border-slate-800 pb-3 flex justify-between items-center">
                <h2 class="text-sm font-black text-white uppercase tracking-wider"><i class="fa-solid fa-plus-circle text-amber-400 mr-1.5"></i> Add New Wholesale Product</h2>
                <span class="text-[10px] text-amber-400 bg-amber-950/50 border border-amber-500/30 px-2 py-0.5 rounded font-bold">Admin Privileged</span>
            </div>

            <form id="addProductForm" onsubmit="handleAddNewProduct(event)" class="space-y-4 text-xs">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-slate-300 mb-1 font-semibold">Product Title *</label>
                        <input type="text" id="prodTitle" placeholder="e.g. Women 2 Piece Suit" required class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-slate-300 mb-1 font-semibold">SKU Code *</label>
                        <input type="text" id="prodSku" placeholder="e.g. PT-FASH-101" required class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-slate-300 mb-1 font-semibold">Category *</label>
                        <select id="prodCategory" required class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                            <option value="Fashion & Apparel">Fashion & Apparel</option>
                            <option value="Electronics & Gadgets">Electronics & Gadgets</option>
                            <option value="Home & Kitchen">Home & Kitchen</option>
                            <option value="Accessories">Accessories</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-slate-300 mb-1 font-semibold">Wholesale Price (PKR) *</label>
                        <input type="number" id="prodPrice" placeholder="1500" required class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-slate-300 mb-1 font-semibold">Upload Product Image *</label>
                        <input type="file" id="prodImageFile" accept="image/*" required class="w-full p-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-300 text-xs file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-600">
                    </div>
                    <div>
                        <label class="block text-slate-300 mb-1 font-semibold">Upload Video Demo (Optional)</label>
                        <input type="file" id="prodVideoFile" accept="video/*" class="w-full p-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-300 text-xs file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-white hover:file:bg-slate-700">
                    </div>
                </div>

                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Product Description & Specs *</label>
                    <textarea id="prodDesc" rows="3" placeholder="Enter product specifications, material details, sizes, etc." required class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-lg text-xs uppercase shadow-lg transition tracking-wider">
                    Publish Product to Catalog
                </button>
            </form>
        </div>

        <!-- Existing Products Management Table -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-sm font-black text-white uppercase tracking-wider"><i class="fa-solid fa-boxes-stacked text-amber-400 mr-1.5"></i> Manage Uploaded Products</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-[11px] uppercase">
                            <th class="p-3">Image</th>
                            <th class="p-3">SKU & Title</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Price</th>
                            <th class="p-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminProductTableBody" class="divide-y divide-slate-800 text-xs">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-slate-500">Loading products...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Firebase SDKs & Script -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCRkKoE48FjYIjYfUNFEYzcxNueKUm6YOM",
          authDomain: "prime-traders-f3eec.firebaseapp.com",
          projectId: "prime-traders-f3eec",
          storageBucket: "prime-traders-f3eec.firebasestorage.app",
          messagingSenderId: "499740236001",
          appId: "1:499740236001:web:e623dfe11f6f96df22ffa0",
          measurementId: "G-6CGVKBZFJK"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check Admin Auth Protection
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                loadAdminProducts();
            }
        });

        // Helper function to convert file to Base64
        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function handleAddNewProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Processing & Uploading Files...";

            const title = document.getElementById('prodTitle').value.trim();
            const sku = document.getElementById('prodSku').value.trim();
            const category = document.getElementById('prodCategory').value;
            const price = parseFloat(document.getElementById('prodPrice').value);
            const desc = document.getElementById('prodDesc').value.trim();

            const imageFile = document.getElementById('prodImageFile').files[0];
            const videoFile = document.getElementById('prodVideoFile').files[0];

            try {
                let imageBase64 = "";
                let videoBase64 = "";

                if (imageFile) {
                    imageBase64 = await convertFileToBase64(imageFile);
                }

                if (videoFile) {
                    videoBase64 = await convertFileToBase64(videoFile);
                }

                await db.collection('products').add({
                    title,
                    sku,
                    category,
                    price,
                    image: imageBase64,
                    videoUrl: videoBase64,
                    desc,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Product aur media successfully publish ho gaye hain! 🎉");
                document.getElementById('addProductForm').reset();
                loadAdminProducts();
            } catch (err) {
                alert("Error uploading product: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Publish Product to Catalog";
            }
        }

        async function loadAdminProducts() {
            const tbody = document.getElementById('adminProductTableBody');
            try {
                const snapshot = await db.collection('products').orderBy('createdAt', 'desc').get();
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">No products uploaded yet.</td></tr>`;
                    return;
                }

                let html = '';
                snapshot.forEach(doc => {
                    const p = doc.data();
                    const id = doc.id;
                    html += `
                        <tr class="hover:bg-slate-900/50 transition border-b border-slate-800">
                            <td class="p-3">
                                <img src="${p.image || 'https://via.placeholder.com/100'}" class="w-10 h-10 object-cover rounded-lg border border-slate-700">
                            </td>
                            <td class="p-3">
                                <div class="font-bold text-slate-100">${p.title}</div>
                                <div class="text-[10px] text-amber-400 font-mono">${p.sku}</div>
                            </td>
                            <td class="p-3 text-slate-300">${p.category}</td>
                            <td class="p-3 font-bold text-amber-300">PKR ${p.price}</td>
                            <td class="p-3 text-center">
                                <button onclick="deleteProduct('${id}')" class="bg-rose-600/80 hover:bg-rose-700 text-white px-2.5 py-1 rounded text-[11px] font-bold transition shadow">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-rose-400">Error loading products.</td></tr>`;
            }
        }

        async function deleteProduct(id) {
            if (confirm("Kya aap waqai is product ko delete karna chahte hain?")) {
                try {
                    await db.collection('products').doc(id).delete();
                    alert("Product delete ho gaya!");
                    loadAdminProducts();
                } catch (err) {
                    alert("Error deleting product: " + err.message);
                }
            }
        }

        function handleLogout() {
            auth.signOut().then(() => {
                window.location.href = "login.html";
            });
        }
    </script>
</body>
</html>
