<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Prime Traders Wholeseller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans px-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="bg-amber-500 text-slate-950 font-black text-2xl w-12 h-12 flex items-center justify-center rounded-2xl mx-auto shadow-lg">P</div>
            <h1 class="text-lg font-black uppercase text-white tracking-wider">Admin / Vendor Portal</h1>
            <p class="text-xs text-slate-400">Sign in to manage wholesale catalog inventory</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Admin Email</label>
                <input type="email" id="loginEmail" placeholder="admin@primetraders.com" required class="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white outline-none focus:border-amber-400 transition">
            </div>
            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white outline-none focus:border-amber-400 transition">
            </div>

            <button type="submit" id="loginBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-xl text-xs uppercase shadow-lg transition tracking-wider">
                Secure Login
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-slate-400 hover:text-amber-400 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Public Catalog
            </a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCRkKoE48FjYIjYfUNFEYzcxNueKUm6YOM",
          authDomain: "prime-traders-f3eec.firebaseapp.com",
          projectId: "prime-traders-f3eec",
          storageBucket: "prime-traders-f3eec.firebasestorage.app",
          messagingSenderId: "499740236001",
          appId: "1:499740236001:web:e623dfe11f6f96df22ffa0",
          measurementId: "G-6CGVKBZFJK"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            btn.disabled = true;
            btn.innerText = "Authenticating...";

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Login successful, redirect directly to admin catalog management panel
                window.location.href = "admin-catalog.html";
            } catch (err) {
                alert("Login Failed: " + err.message);
                btn.disabled = false;
                btn.innerText = "Secure Login";
            }
        }
    </script>
</body>
</html>
