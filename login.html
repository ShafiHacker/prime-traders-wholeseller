<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Prime Traders Wholeseller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans p-4">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-6 text-center">
        
        <div class="inline-flex bg-amber-500 text-slate-950 font-black text-2xl w-14 h-14 items-center justify-center rounded-2xl shadow-lg mb-1">
            P
        </div>
        <div>
            <h1 class="text-lg font-black tracking-wider uppercase text-white">ADMIN / VENDOR PORTAL</h1>
            <p class="text-xs text-slate-400 mt-1">Sign in to manage wholesale catalog inventory</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4 text-left text-xs">
            <div>
                <label class="block text-slate-300 font-bold mb-1">Admin Email</label>
                <input type="email" id="loginEmail" required placeholder="admin@primetraders.com" class="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white outline-none focus:border-amber-400 transition">
            </div>

            <div>
                <label class="block text-slate-300 font-bold mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full p-3 pr-10 bg-slate-950 border border-slate-700 rounded-xl text-white outline-none focus:border-amber-400 transition">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-3.5 text-slate-400 hover:text-white text-sm">
                        <i id="togglePasswordIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div id="authMsg" class="hidden text-rose-400 text-center font-bold"></div>

            <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-xl text-xs uppercase shadow-lg transition tracking-wide">
                Secure Login
            </button>

            <!-- Forgot Password Link -->
            <div class="text-center pt-1">
                <button type="button" onclick="handleForgotPassword()" class="text-amber-400 hover:text-amber-300 text-[11px] font-bold transition">
                    Forgot Password? Click here to reset
                </button>
            </div>
        </form>

        <div class="border-t border-slate-800 pt-4">
            <a href="index.html" class="text-slate-400 hover:text-white text-xs font-bold transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-arrow-left text-amber-400"></i> Back to Public Catalog
            </a>
        </div>
    </div>

    <!-- Custom Popup Alert Modal (Modern UI) -->
    <div id="customAlertModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white text-slate-900 rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4 transform transition-all scale-95 animate-in fade-in zoom-in duration-200 border border-slate-100">
            <!-- Dynamic Icon Container -->
            <div id="customAlertIcon" class="flex justify-center text-emerald-500 text-5xl mb-2">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <!-- Title & Message -->
            <h3 id="customAlertTitle" class="text-xl font-black uppercase tracking-wider text-slate-900">SUCCESS</h3>
            <p id="customAlertMessage" class="text-xs text-slate-600 font-medium leading-relaxed px-2">
                Your request has been processed successfully.
            </p>
            <!-- Action Button -->
            <button id="customAlertBtn" onclick="closeCustomAlert()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-xl text-xs tracking-wider uppercase shadow-lg transition transform active:scale-95">
                Continue
            </button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCRkKoE48FjYIjYfUNFEYzcxNueKUm6YOM",
          authDomain: "prime-traders-f3eec.firebaseapp.com",
          projectId: "prime-traders-f3eec",
          storageBucket: "prime-traders-f3eec.firebasestorage.app",
          messagingSenderId: "499740236001",
          appId: "1:499740236001:web:e623dfe11f6f96df22ffa0",
          measurementId: "G-6CGVKBZFJK"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('loginPassword');
            const toggleIcon = document.getElementById('togglePasswordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Login Handler
        async function handleLogin(e) {
            if (e) e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;
            const authMsg = document.getElementById('authMsg');

            try {
                await auth.signInWithEmailAndPassword(email, pass);
                window.location.href = "admin-catalog.html";
            } catch (err) {
                authMsg.innerText = "Invalid email or password.";
                authMsg.classList.remove('hidden');
                showCustomAlert("ERROR!", "Invalid email or password.", "error");
            }
        }

        // Forgot Password Handler
        async function handleForgotPassword() {
            const emailInput = document.getElementById('loginEmail');
            const email = emailInput ? emailInput.value.trim() : "";

            if (!email) {
                showCustomAlert("ERROR!", "Karam karke pehle upar 'Admin Email' wale khali box mein apna email enter karein, phir 'Forgot Password' par click karein!", "error");
                if (emailInput) emailInput.focus();
                return;
            }

            try {
                await auth.sendPasswordResetEmail(email);
                showCustomAlert("SUCCESS", `Password reset link successfully bhej diya gaya hai!\n\nKripya apna Gmail (${email}) check karein.`, "success");
            } catch (error) {
                let errMsg = error.message;
                if (error.code === 'auth/user-not-found') {
                    errMsg = "Is email address par koi account registered nahi hai.";
                } else if (error.code === 'auth/invalid-email') {
                    errMsg = "Email address theek nahi hai.";
                }
                showCustomAlert("ERROR!", "Error: " + errMsg, "error");
            }
        }

        // Custom Modal Alert Function
        function showCustomAlert(title, message, type = 'success', callback = null) {
            const modal = document.getElementById('customAlertModal');
            if (!modal) {
                alert(message);
                return;
            }

            const titleEl = document.getElementById('customAlertTitle');
            const msgEl = document.getElementById('customAlertMessage');
            const iconEl = document.getElementById('customAlertIcon');
            const btnEl = document.getElementById('customAlertBtn');

            titleEl.innerText = title || (type === 'success' ? 'SUCCESS' : 'ERROR!');
            msgEl.innerText = message || '';

            if (type === 'success') {
                titleEl.className = "text-xl font-black uppercase tracking-wider text-emerald-600";
                iconEl.className = "flex justify-center text-emerald-500 text-5xl mb-2";
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                btnEl.className = "w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-xl text-xs tracking-wider uppercase shadow-lg transition transform active:scale-95";
            } else {
                titleEl.className = "text-xl font-black uppercase tracking-wider text-rose-600";
                iconEl.className = "flex justify-center text-rose-500 text-5xl mb-2";
                iconEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                btnEl.className = "w-full py-3 bg-rose-500 hover:bg-rose-600 text-white font-black rounded-xl text-xs tracking-wider uppercase shadow-lg transition transform active:scale-95";
            }

            btnEl.onclick = function() {
                closeCustomAlert();
                if (typeof callback === 'function') callback();
            };

            modal.classList.remove('hidden');
        }

        function closeCustomAlert() {
            const modal = document.getElementById('customAlertModal');
            if (modal) modal.classList.add('hidden');
        }
    </script>
</body>
</html>
