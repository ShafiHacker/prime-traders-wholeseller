<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog & Products | Prime Traders Wholeseller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md bg-opacity-95">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <!-- Logo Brand -->
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-slate-950 font-black text-xl w-10 h-10 flex items-center justify-center rounded-xl shadow-lg">P</div>
                <div>
                    <h1 class="text-base font-black tracking-wider uppercase text-white">PRIME TRADERS</h1>
                    <p class="text-[10px] text-amber-400 font-bold uppercase tracking-widest">Wholesale & Dropship Hub</p>
                </div>
            </div>

            <!-- Quick Action Links -->
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="login.html" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-black transition flex items-center gap-1.5 shadow-lg">
                    <i class="fa-solid fa-user-shield"></i> Admin / Vendor Login
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- Hero Search & Filter Section -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h2 class="text-lg font-black text-white">Product Catalog & Wholesale Inventory</h2>
                    <p class="text-xs text-slate-400">Browse hot trending products with wholesale pricing, high-res images, and video demos.</p>
                </div>
                <!-- Search Bar -->
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-slate-500 text-xs"></i>
                    <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Search products or SKU..." class="w-full pl-9 pr-4 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white outline-none focus:border-amber-400 transition">
                </div>
            </div>

            <!-- Category Filter Pills -->
            <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs" id="categoryFilterContainer">
                <button onclick="setCategory('All', this)" class="cat-btn px-4 py-1.5 rounded-lg font-bold bg-amber-500 text-slate-950 transition whitespace-nowrap shadow">All Products</button>
                <button onclick="setCategory('Fashion & Apparel', this)" class="cat-btn px-4 py-1.5 rounded-lg font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">Fashion & Apparel</button>
                <button onclick="setCategory('Electronics & Gadgets', this)" class="cat-btn px-4 py-1.5 rounded-lg font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">Electronics & Gadgets</button>
                <button onclick="setCategory('Home & Kitchen', this)" class="cat-btn px-4 py-1.5 rounded-lg font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">Home & Kitchen</button>
                <button onclick="setCategory('Accessories', this)" class="cat-btn px-4 py-1.5 rounded-lg font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">Accessories</button>
            </div>
        </div>

        <!-- Products Grid Showcase -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Dynamic Cards Will Load Here -->
            <div class="col-span-full text-center py-12 text-slate-500 text-xs font-semibold">
                <i class="fa-solid fa-spinner fa-spin text-amber-400 text-xl mb-2"></i><br>Loading catalog inventory...
            </div>
        </div>

    </main>

    <!-- Product Details / Video Modal -->
    <div id="productModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-2xl relative">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-2 rounded-full w-8 h-8 flex items-center justify-center text-xs">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div id="modalContent" class="space-y-4 text-xs">
                <!-- Dynamically Populated Details -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-slate-500 text-[11px]">
        &copy; 2026 Prime Traders Wholeseller Portal. All rights reserved.
    </footer>

    <!-- Firebase & Catalog Logic Script -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        // Firebase Config (Shared with main project)
        const firebaseConfig = {
          apiKey: "AIzaSyCRkKoE48FjYIjYfUNFEYzcxNueKUm6YOM",
          authDomain: "prime-traders-f3eec.firebaseapp.com",
          projectId: "prime-traders-f3eec",
          storageBucket: "prime-traders-f3eec.firebasestorage.app",
          messagingSenderId: "499740236001",
          appId: "1:499740236001:web:e623dfe11f6f96df22ffa0",
          measurementId: "G-6CGVKBZFJK"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allProducts = [];
        let selectedCategory = 'All';

        // Load Products on Startup
        async function fetchCatalogProducts() {
            try {
                const snapshot = await db.collection('products').get();
                allProducts = [];
                snapshot.forEach(doc => {
                    allProducts.push({ id: doc.id, ...doc.data() });
                });

                // Fallback Mock Data if Firestore is empty so catalog looks rich immediately
                if (allProducts.length === 0) {
                    allProducts = [
                        { id: '1', title: 'Women 2 Piece Pret Stitched Shalwar Kameez', category: 'Fashion & Apparel', price: 1575, sku: 'PT-FASH-01', image: 'https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&q=80&w=500', videoUrl: '', desc: 'Premium quality stitched 2-piece outfit designed for modern casual and party wear.' },
                        { id: '2', title: 'Wireless RGB Gaming Headset with Mic', category: 'Electronics & Gadgets', price: 2499, sku: 'PT-ELEC-02', image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&q=80&w=500', videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4', desc: 'High bass surround sound wireless headset with dynamic RGB lighting and noise cancellation.' },
                        { id: '3', title: 'Multipurpose Kitchen Wall Mounted Spice Rack', category: 'Home & Kitchen', price: 899, sku: 'PT-HOME-03', image: 'https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&q=80&w=500', videoUrl: '', desc: 'Organize your kitchen space efficiently with heavy-duty rustproof wall organizers.' },
                        { id: '4', title: 'Smart Bluetooth Fitness Tracking Smartwatch', category: 'Accessories', price: 1950, sku: 'PT-ACC-04', image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&q=80&w=500', videoUrl: '', desc: 'Heart rate monitor, step counter, sleep tracker, and full touch HD color display.' }
                    ];
                }

                renderProducts(allProducts);
            } catch (err) {
                console.error("Error fetching products:", err);
                document.getElementById('productGrid').innerHTML = `<div class="col-span-full text-center text-rose-400 py-8">Failed to load inventory. Please check connection.</div>`;
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            if (!products.length) {
                grid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-12">No products found in this category.</div>`;
                return;
            }

            let html = '';
            products.forEach(p => {
                html += `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden hover:border-amber-400/60 transition shadow-lg flex flex-col justify-between">
                        <div>
                            <div class="relative h-48 bg-slate-950 overflow-hidden cursor-pointer" onclick="openProductModal('${p.id}')">
                                <img src="${p.image || 'https://via.placeholder.com/400'}" alt="${p.title}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                                <span class="absolute top-2 left-2 bg-slate-950/80 backdrop-blur-md text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded text-[10px] font-bold font-mono">${p.sku || 'PT-SKU'}</span>
                            </div>
                            <div class="p-3.5 space-y-2">
                                <span class="text-[10px] font-bold text-amber-500 uppercase tracking-wider">${p.category || 'General'}</span>
                                <h3 class="font-bold text-slate-100 text-xs line-clamp-2 cursor-pointer hover:text-amber-400" onclick="openProductModal('${p.id}')">${p.title}</h3>
                                <div class="text-sm font-black text-amber-300">PKR ${p.price || 0} <span class="text-[10px] text-slate-400 font-normal">Wholesale</span></div>
                            </div>
                        </div>
                        <div class="p-3.5 pt-0 grid grid-cols-2 gap-2">
                            <button onclick="openProductModal('${p.id}')" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-lg text-[11px] transition">
                                <i class="fa-solid fa-eye mr-1"></i> Details
                            </button>
                            <a href="https://wa.me/923032091411?text=Hello%20Prime%20Traders,%20I%20want%20to%20order%20this%20wholesale%20product:%0A*SKU:*%20${encodeURIComponent(p.sku || 'N/A')}%0A*Title:*%20${encodeURIComponent(p.title)}%0A*Price:*%20PKR%20${p.price}" target="_blank" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-[11px] text-center transition flex items-center justify-center gap-1 shadow">
                                <i class="fa-brands fa-whatsapp"></i> Order
                            </a>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function setCategory(cat, btn) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn px-4 py-1.5 rounded-lg font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap";
            });
            btn.className = "cat-btn px-4 py-1.5 rounded-lg font-bold bg-amber-500 text-slate-950 transition whitespace-nowrap shadow";
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchCat = selectedCategory === 'All' || p.category === selectedCategory;
                const matchQuery = (p.title && p.title.toLowerCase().includes(query)) || (p.sku && p.sku.toLowerCase().includes(query));
                return matchCat && matchQuery;
            });
            renderProducts(filtered);
        }

        function openProductModal(id) {
            const p = allProducts.find(item => item.id === id);
            if (!p) return;

            const modalHtml = `
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-[10px] font-bold text-amber-400 bg-amber-950/50 border border-amber-500/30 px-2 py-0.5 rounded">${p.category}</span>
                        <h2 class="text-sm font-bold text-white mt-1">${p.title}</h2>
                        <p class="text-[11px] text-slate-400 font-mono mt-0.5">SKU: ${p.sku || 'N/A'}</p>
                    </div>
                    <div class="text-right">
                        <div class="text-base font-black text-amber-300">PKR ${p.price}</div>
                        <span class="text-[10px] text-emerald-400 font-bold">In Stock (Wholesale)</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-slate-950 rounded-xl overflow-hidden h-64 border border-slate-800">
                        <img src="${p.image || 'https://via.placeholder.com/400'}" class="w-full h-full object-cover">
                    </div>
                    ${p.videoUrl ? `
                        <div class="bg-slate-950 rounded-xl overflow-hidden h-64 border border-slate-800 flex items-center justify-center">
                            <video controls class="w-full h-full object-cover">
                                <source src="${p.videoUrl}" type="video/mp4">
                                Your browser does not support video tag.
                            </video>
                        </div>
                    ` : `
                        <div class="bg-slate-950 rounded-xl p-4 border border-slate-800 flex flex-col justify-center text-slate-400 text-center">
                            <i class="fa-solid fa-video-slash text-2xl mb-2 text-slate-600"></i>
                            <p class="text-xs">No video demonstration attached for this product.</p>
                        </div>
                    `}
                </div>

                <div>
                    <h3 class="font-bold text-slate-300 mb-1 text-xs">Product Description & Specifications:</h3>
                    <p class="text-xs text-slate-400 bg-slate-950 p-3 rounded-lg border border-slate-800 leading-relaxed">${p.desc || 'No description provided.'}</p>
                </div>

                <div class="pt-2 flex gap-3">
                    <a href="https://wa.me/923032091411?text=Hello%20Prime%20Traders,%20I%20want%20to%20order:%0A*SKU:*%20${encodeURIComponent(p.sku || 'N/A')}%0A*Title:*%20${encodeURIComponent(p.title)}%0A*Price:*%20PKR%20${p.price}" target="_blank" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-center text-xs shadow transition flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp text-sm"></i> Order via WhatsApp
                    </a>
                    <button onclick="closeProductModal()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs">Close</button>
                </div>
            `;

            document.getElementById('modalContent').innerHTML = modalHtml;
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        // Initialize Fetch
        window.onload = () => {
            fetchCatalogProducts();
        };
    </script>
</body>
</html>
