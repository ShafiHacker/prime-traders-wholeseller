<!DOCTYPE html>
<html lang="en">

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

                <div class="bg-amber-500 text-slate-950 font-black text-xl w-10 h-10 flex items-center justify-center rounded-xl shadow-lg">P</div>
                <div>
                    <h1 class="text-base font-black tracking-wider uppercase text-white">PRIME TRADERS</h1>
                    <p class="text-[10px] text-amber-400 font-bold uppercase tracking-widest">Wholesale & Dropship Hub</p>
                </div>
            </div>

            <div class="flex items-center gap-3">

                    <i class="fa-solid fa-house"></i> Home
                </a>
                
                <button onclick="openCartModal()" class="relative bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 border border-amber-500/30">

                </button>

                <a href="login.html" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-black transition flex items-center gap-1.5 shadow-lg">
                    <i class="fa-solid fa-user-shield"></i> Admin Login
                </a>
            </div>
        </div>
    </header>

            </div>
